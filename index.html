<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Tetris</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-animation">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="game-wrapper">
        <header>
            <h1>TETRIS</h1>
        </header>

        <div class="game-container">
            <div class="panel left-panel">
                <div class="glass-box info-box">
                    <h3>SCORE</h3>
                    <div id="score" class="value">0</div>
                </div>
                <div class="glass-box info-box">
                    <h3>LEVEL</h3>
                    <div id="level" class="value">1</div>
                </div>
                <div class="glass-box info-box">
                    <h3>LINES</h3>
                    <div id="lines" class="value">0</div>
                </div>
            </div>

            <div class="board-container">
                <canvas id="tetris" width="300" height="600"></canvas>
                <div id="game-over-screen" class="overlay hidden">
                    <h2>GAME OVER</h2>
                    <p>Final Score: <span id="final-score">0</span></p>
                    <button id="restart-btn" class="glow-btn">PLAY AGAIN</button>
                </div>
                <div id="pause-screen" class="overlay hidden">
                    <h2>PAUSED</h2>
                    <p>Press ESC to resume</p>
                </div>
            </div>

            <div class="panel right-panel">
                <div class="glass-box next-box">
                    <h3>NEXT</h3>
                    <canvas id="next-piece" width="120" height="120"></canvas>
                </div>
                
                <div class="glass-box controls-box">
                    <h3>CONTROLS</h3>
                    <ul>
                        <li><span class="key">←</span> <span class="key">→</span> Move</li>
                        <li><span class="key">↑</span> Rotate</li>
                        <li><span class="key">↓</span> Soft Drop</li>
                        <li><span class="key">Space</span> Hard Drop</li>
                        <li><span class="key">Esc</span> Pause</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="tetris.js"></script>
</body>
</html>
